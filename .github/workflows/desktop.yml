name: desktop

# Builds Linux and macOS bundles. Neither can be produced from Windows:
# PyInstaller cannot cross-compile.
#
# There is no GUI toolkit in this project any more (the UI is a local web page), so
# these jobs need no SDL/OpenGL/xvfb and no Kivy - which is exactly what used to make
# the macOS job fail.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'webui/**'
      - 'scripts/**'
      - 'gui/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    name: import + CLI smoke test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # Deliberately no Kivy: nothing in this project imports a GUI toolkit.
        run: |
          python -m pip install --upgrade pip
          python -m pip install jmcomic requests img2pdf pillow

      - name: Byte-compile everything
        run: python -m compileall -q gui scripts webui

      - name: Engine imports without any GUI toolkit or terminal
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import jmcore
          for forbidden in ('tkinter', 'kivy'):
              assert forbidden not in sys.modules, f'engine must not pull in {forbidden}'
          print('jmcore OK; android =', jmcore.is_android())
          print('default http backend =', jmcore.default_http_backend())
          PY

      - name: Web UI imports and carries its embedded page
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'webui')
          sys.path.insert(0, 'scripts')
          import server
          assert '__TOKEN__' in server.INDEX_HTML, 'page must keep the token placeholder'
          assert len(server.INDEX_HTML) > 1000
          print('webui OK; page bytes =', len(server.INDEX_HTML))
          PY

      - name: CLI still satisfies its JSON contract
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/jmctl.py doctor --no-network > out.json 2>/dev/null
          python - <<'PY'
          import json
          data = json.load(open('out.json', encoding='utf-8'))
          assert data['status'] == 'ok', data
          assert data['schemaVersion'] == 1
          print('doctor JSON OK:', data['platform'], data['httpBackend'])
          PY

      # These two encode Android build rules that cost several broken CI runs to
      # discover. Both are fast (no Android toolchain) and run on every push.
      - name: Android requirements must be resolvable by python-for-android
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_android_requirements.py

      - name: App must work with PyYAML unavailable
        # Android omits pyyaml (C extension, no pure/Android wheel, no p4a recipe).
        # This blocks the import and performs a real download to prove that is safe.
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_no_yaml.py

  linux:
    name: linux bundle
    runs-on: ubuntu-22.04
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jmcomic requests img2pdf pillow pyinstaller

      - name: Build
        # --console keeps the URL visible in the job log. On Linux that does NOT change
        # the artifact shape (a plain folder either way).
        run: |
          set -o pipefail
          if ! python gui/build.py --onedir --console 2>&1 | tee build.log; then
            echo "::error title=linux build failed::$(grep -v 'TRACE:' build.log | grep -iE 'error|exception|not found|cannot|died' | tail -n 4 | tr '\n' ' | ')"
            exit 1
          fi

      - name: Verify the frozen bundle serves the UI and downloads
        # Real end-to-end check of the packaged binary: starts it, drives the HTTP API,
        # and downloads one chapter with PDF export.
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_frozen.py dist/jmcomic-downloader/jmcomic-downloader

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: jmcomic-linux
          path: dist/jmcomic-downloader/
          if-no-files-found: error

      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd dist
          tar -czf jmcomic-linux-x86_64.tar.gz jmcomic-downloader
          ls -lh jmcomic-linux-x86_64.tar.gz

      - name: Attach Linux build to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jmcomic-linux-x86_64.tar.gz
          fail_on_unmatched_files: false

  windows:
    name: windows exe
    runs-on: windows-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jmcomic requests img2pdf pillow pyinstaller

      - name: Build
        # --onedir: a one-file build re-extracts ~50 MB on every launch.
        run: python gui/build.py --onedir --console

      - name: Verify the frozen bundle serves the UI and downloads
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_frozen.py "dist/jmcomic-downloader/jmcomic-downloader.exe"

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path dist/jmcomic-downloader/* -DestinationPath dist/jmcomic-windows-x64.zip

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: jmcomic-windows
          path: dist/jmcomic-windows-x64.zip
          if-no-files-found: error

      - name: Attach Windows build to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jmcomic-windows-x64.zip
          fail_on_unmatched_files: false

  macos:
    name: macos app
    runs-on: macos-14
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jmcomic requests img2pdf pillow pyinstaller

      - name: Build .app
        # No --console here: PyInstaller only produces a .app bundle with --windowed,
        # and the .app is what users need. The verification step below does not need a
        # console because it reads the URL from --url-file.
        run: |
          set -o pipefail
          if ! python gui/build.py --onedir 2>&1 | tee build.log; then
            echo "::error title=macos build failed::$(grep -v 'TRACE:' build.log | grep -iE 'error|exception|not found|cannot|died' | tail -n 4 | tr '\n' ' | ')"
            exit 1
          fi
          test -x "dist/jmcomic-downloader.app/Contents/MacOS/jmcomic-downloader" \
            || { echo "::error title=macos bundle malformed::no executable inside the .app"; exit 1; }

      - name: Verify the frozen bundle serves the UI and downloads
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_frozen.py "dist/jmcomic-downloader.app/Contents/MacOS/jmcomic-downloader"

      - name: Zip the bundle
        run: |
          cd dist
          zip -qry jmcomic-macos.zip jmcomic-downloader.app
          ls -lh

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: jmcomic-macos
          path: dist/jmcomic-macos.zip
          if-no-files-found: error

      - name: Attach macOS build to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jmcomic-macos.zip
          fail_on_unmatched_files: false
