name: android

# Android needs a Linux host, so CI is the practical way to build the APK when your
# dev machine is Windows. Push a tag, or run this manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug produces an installable APK; release needs signing secrets'
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      # Keep this in sync with the app version.
      APP_VERSION: '1.0.0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      # ndk / sdk / p4a downloads are the slow part; caching them turns a ~60 min
      # cold build into a few minutes.
      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Cache buildozer project directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ hashFiles('buildozer.spec', 'recipes/**') }}
          restore-keys: buildozer-project-

      - name: Stage shared engine into gui/
        run: |
          set -x
          python -V
          ls -la
          python -m compileall -q gui scripts
          python gui/build_android.py prepare
          echo "STAGING_OK"
          ls -la gui/

      - name: Build APK (debug)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        run: buildozer android debug

      - name: Build release bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        env:
          P4A_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEYALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEYALIAS_PASSWORD }}
        run: |
          if [ -z "$P4A_RELEASE_KEYSTORE" ]; then
            echo "::error::release build needs the ANDROID_KEYSTORE_BASE64 secret; see ANDROID.md"
            exit 1
          fi
          echo "$P4A_RELEASE_KEYSTORE" | base64 -d > release.keystore
          buildozer android release

      - name: Show buildozer log on failure
        if: failure()
        run: |
          echo "===== tail of buildozer log ====="
          tail -n 200 .buildozer/android/platform/build-*/build.log 2>/dev/null || \
            echo "(no build.log found)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jmcomic-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload AAB
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: jmcomic-aab
          path: bin/*.aab
          if-no-files-found: warn

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          fail_on_unmatched_files: false
