name: android

# Android needs a Linux host, so CI is the practical way to build the APK when your
# dev machine is Windows. Push a tag, or run this manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'debug produces an installable APK; release needs signing secrets'
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      # Keep this in sync with the app version.
      APP_VERSION: '1.0.0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36
          # buildozer may pull a stale python-for-android whose code does
          #   from pip._internal.exceptions import BuildDependencyInstallError
          # That name is gone from modern pip, and p4a *upgrades pip inside its own
          # build venv*, so the build dies with:
          #   ImportError: cannot import name 'BuildDependencyInstallError'
          # Fixed upstream; verified that 2026.5.9 no longer references it.
          python -m pip install --upgrade "python-for-android==2026.5.9"
          python - <<'PY'
          import os, pythonforandroid
          print('p4a', getattr(pythonforandroid, '__version__', '?'),
                'at', os.path.dirname(pythonforandroid.__file__))
          PY

      # ndk / sdk / p4a downloads are the slow part; caching them turns a ~60 min
      # cold build into a few minutes.
      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Cache buildozer project directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ hashFiles('buildozer.spec', 'recipes/**') }}
          restore-keys: buildozer-project-

      # `buildozer android debug` lets Gradle sign with ~/.android/debug.keystore.
      # A fresh runner generates a NEW random key, so APKs from different runs have
      # different signatures and cannot be installed over one another
      # (INSTALL_FAILED_UPDATE_INCOMPATIBLE). Caching the keystore keeps debug builds
      # upgradeable. Use a static key: the point is persistence, not invalidation.
      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore-v1

      - name: Stage shared engine into webui/
        run: |
          set -x
          python -V
          ls -la
          python -m compileall -q gui scripts webui
          python gui/build_android.py prepare
          echo "STAGING_OK"
          ls -la webui/

      # buildozer installs a 2021-vintage cmdline-tools whose sdkmanager cannot run on
      # JDK 17 (it needs the JAXB classes removed in Java 11), so it silently installs
      # nothing. The diagnostic run showed exactly that:
      #
      #   top: commandlinetools-linux-6514223_latest.zip tools
      #   build-tools: (empty)   platforms: (empty)   available build-tools: (empty)
      #
      # -> no build-tools -> "build-tools folder not found" / "Aidl not found".
      #
      # Fix: put a CURRENT cmdline-tools into buildozer's SDK directory. buildozer looks
      # for `tools/bin/sdkmanager` (buildozer/targets/android.py, sdkmanager_path), so
      # the modern one is symlinked there too.
      - name: Provision a modern Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "downloading current cmdline-tools"
            curl -fsSL -o /tmp/clt.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/clt && mkdir -p /tmp/clt
            unzip -q /tmp/clt.zip -d /tmp/clt
            mkdir -p "$SDK/cmdline-tools"
            mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"
          ln -sf "$SDK/cmdline-tools/latest/bin/avdmanager" "$SDK/tools/bin/avdmanager"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          "$SM" --version
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "build-tools now: $(ls "$SDK/build-tools" 2>/dev/null | tr '\n' ' ')"

      # The `.buildozer` cache also restores buildozer's recorded install state, and
      # buildozer short-circuits its installer on a state match:
      #
      #     cache_key = 'android:sdk_installation'
      #     if self.buildozer.state.get(cache_key, None) == cache_value:
      #         return True          # <- never installs build-tools
      #
      # Deleting state.db makes it re-check the SDK with the good sdkmanager above.
      - name: Clear stale buildozer SDK state
        run: |
          rm -f .buildozer/state.db
          echo "cleared .buildozer/state.db so SDK components are re-checked"

      - name: Build APK (debug)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        run: |
          set -o pipefail
          if ! buildozer android debug 2>&1 | tee apk-build.log; then
            echo "::error title=apk build failed::$(grep -v 'TRACE:' apk-build.log | grep -iE 'error|exception|not found|cannot|failed|died' | tail -n 4 | tr '\n' ' | ')"
            exit 1
          fi

      - name: Build release bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        env:
          P4A_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEYALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEYALIAS_PASSWORD }}
        run: |
          if [ -z "$P4A_RELEASE_KEYSTORE" ]; then
            echo "::error::release build needs the ANDROID_KEYSTORE_BASE64 secret; see ANDROID.md"
            exit 1
          fi
          echo "$P4A_RELEASE_KEYSTORE" | base64 -d > release.keystore
          buildozer android release

      - name: Show buildozer log on failure
        if: failure()
        run: |
          echo "===== tail of buildozer log ====="
          tail -n 200 .buildozer/android/platform/build-*/build.log 2>/dev/null || \
            echo "(no build.log found)"

      # "build-tools folder not found" / "Aidl not found" only says the SDK is
      # incomplete; this reports what is ACTUALLY on disk and whether sdkmanager can
      # be found at all, as a readable annotation.
      - name: Diagnose the Android SDK layout
        if: failure()
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          {
            echo "SDK exists=$([ -d "$SDK" ] && echo yes || echo no)"
            echo "top: $(ls "$SDK" 2>/dev/null | tr '\n' ' ')"
            echo "build-tools: $(ls "$SDK/build-tools" 2>/dev/null | tr '\n' ' ')"
            echo "platforms: $(ls "$SDK/platforms" 2>/dev/null | tr '\n' ' ')"
            SM=$(find "$HOME/.buildozer" -name sdkmanager -type f 2>/dev/null | head -1)
            echo "sdkmanager=$SM"
          } > diag.txt 2>&1
          echo "::error title=android sdk state::$(tr '\n' ' | ' < diag.txt | cut -c1-500)"

      # p4a's real error is buried in thousands of lines. The Build step above already
      # tee'd the entire output to apk-build.log, so mine that instead of hunting for
      # p4a's own log (which may not exist when p4a exits early).
      - name: Diagnose the python-for-android build
        if: failure()
        run: |
          echo "logs present: $(find .buildozer -name '*.log' 2>/dev/null | head -5 | tr '\n' ' ')"
          LOG=apk-build.log
          if [ ! -f "$LOG" ]; then
            LOG=$(find .buildozer -name 'build.log' 2>/dev/null | head -1)
          fi
          if [ -z "$LOG" ] || [ ! -f "$LOG" ]; then
            echo "::error title=p4a::no log to inspect"
            exit 0
          fi
          echo "inspecting $LOG ($(wc -l < "$LOG") lines)"
          # Recipe / dependency-resolution failures are the usual cause; grab those
          # plus tracebacks, with a little context around the first real error.
          grep -nE "Auto module resolution failed|ERROR:|BUILD FAILED|No matching distribution|Could not find a version|ModuleNotFoundError|ImportError|recipe .*(failed|error)|Exception:" "$LOG" \
            | tail -n 10 > p4a_diag.txt 2>&1 || true
          # Then the lines immediately after the first real error, which usually name
          # the offending package.
          FIRST=$(head -1 p4a_diag.txt | cut -d: -f1)
          if [ -n "$FIRST" ]; then
            sed -n "$((FIRST)),$((FIRST+25))p" "$LOG" | sed 's/\x1b\[[0-9;]*m//g' >> p4a_diag.txt
          fi
          echo "::error title=p4a error::$(tr '\n' ' | ' < p4a_diag.txt | cut -c1-1400)"
          echo "===== last 50 lines ====="
          tail -n 50 "$LOG"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jmcomic-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload AAB
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: jmcomic-aab
          path: bin/*.aab
          if-no-files-found: warn

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          fail_on_unmatched_files: false
